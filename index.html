<!DOCTYPE html>
<html>
<head>
  <title>FyzlGroup Financing Request</title>

  <link
    rel="icon"
    type="image/png"
    href="https://i.imgur.com/m7CiCu3_d.png">
</head>

<body>

  <iframe
    id="appFrame"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    ">
  </iframe>

  <script>

    const params =
      new URLSearchParams(window.location.search);

    const token =
      params.get("token");

    let iframeUrl =
      "https://script.google.com/macros/s/AKfycbwrBI2edUL8A2YZdsOCcdhkh83_H5ZpOFrZ6uWk6p6vmiAId57sY9W2m25DR3n0DLo/exec";

    if (token) {

      iframeUrl +=
        "?token=" +
        encodeURIComponent(token);

    }

    document.getElementById("appFrame").src =
      iframeUrl;

    window.onload = function() {

      document
        .getElementById("appFrame")
        .requestFullscreen()
        .catch((err) => {

          console.error(
            "Error attempting to enable full-screen mode:",
            err.message
          );

        });

    };

  </script>

</body>
</html>
